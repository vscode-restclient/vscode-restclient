# El flujo acordado en #6: release-please mantiene un PR de versión a partir de
# los títulos convencionales (feat:/fix:) de lo fusionado; al fusionar ESE PR,
# crea el tag y la release, y este mismo workflow publica.
#
# La publicación va encadenada aquí (job `publish`) y no en release.yml porque
# los tags creados con GITHUB_TOKEN no disparan otros workflows: un release.yml
# esperando el tag se quedaría mudo. release.yml sigue valiendo para un tag
# empujado a mano (respaldo).
name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit
      - name: Sin secretos no hay release silenciosamente rota
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          faltan=""
          [ -z "$VSCE_PAT" ] && faltan="$faltan VSCE_PAT"
          [ -z "$OVSX_PAT" ] && faltan="$faltan OVSX_PAT"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos del repositorio:$faltan — la release existe pero NO se puede publicar. Añadirlos en Settings → Secrets and variables → Actions."
            exit 1
          fi
      - run: npx vsce package --no-dependencies -o "rest-client-${TAG}.vsix"
      - name: Marketplace (se salta si ya está esta versión)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VER="${TAG#v}"
          ID=$(node -p "const p=require('./package.json');p.publisher+'.'+p.name")
          if npx vsce show "$ID" --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{let j={};try{j=JSON.parse(d)||{}}catch{}process.exit((j.versions||[]).some(v=>v.version==='$VER')?0:1)})"; then
            echo "Marketplace ya tiene $VER"
          else
            npx vsce publish --no-dependencies --packagePath "rest-client-${TAG}.vsix"
          fi
      - name: Open VSX (se salta si ya está esta versión)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VER="${TAG#v}"
          ID=$(node -p "const p=require('./package.json');p.publisher+'.'+p.name")
          if npx ovsx get "$ID" -v "$VER" --metadata >/dev/null 2>&1; then
            echo "Open VSX ya tiene $VER"
          else
            npx ovsx publish "rest-client-${TAG}.vsix" -p "$OVSX_PAT"
          fi
      - name: El runner suelto, adjunto a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/cli.js httpkeeper-cli.js
          gh release upload "$TAG" "rest-client-${TAG}.vsix" httpkeeper-cli.js --clobber

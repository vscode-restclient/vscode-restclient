# The flow agreed in #6: release-please keeps a release PR built from the
# conventional titles (feat:/fix:) of what was merged; merging THAT PR creates
# the tag and the release, and this same workflow publishes.
#
# Publishing is chained here (job `publish`) instead of in release.yml because
# tags created with GITHUB_TOKEN do not trigger other workflows: a release.yml
# waiting for the tag would stay silent. release.yml remains valid for a tag
# pushed by hand (fallback).
name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear la release y subirle los ficheros
      id-token: write   # npm trusted publishing (OIDC), ver el paso de npm
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit
      - name: Missing secrets must fail loudly, not leave a half-made release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          missing=""
          [ -z "$VSCE_PAT" ] && missing="$missing VSCE_PAT"
          [ -z "$OVSX_PAT" ] && missing="$missing OVSX_PAT"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — the release exists but cannot be published. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: npx vsce package --no-dependencies -o "restclient-${TAG}.vsix"
      # Adjuntar antes de publicar en tiendas, a proposito: el 28-09 la 1.2.0 murio
      # en el paso del Marketplace y se llevo por delante todo lo que venia
      # detras. Aqui la release ya existe (la crea release-please), asi que lo
      # que no debe depender de las tiendas es que lleve sus ficheros adjuntos.
      - name: The standalone runner, for the GitHub action and for npx without npm
        run: cp dist/cli.js restclient.js
      - name: The runner and the .vsix, attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "restclient-${TAG}.vsix" restclient.js --clobber
      - name: Marketplace (skipped if this version is already there)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VER="${TAG#v}"
          ID=$(node -p "const p=require('./package.json');p.publisher+'.'+p.name")
          if npx vsce show "$ID" --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{let j={};try{j=JSON.parse(d)||{}}catch{}process.exit((j.versions||[]).some(v=>v.version==='$VER')?0:1)})"; then
            echo "Marketplace already has $VER"
          else
            npx vsce publish --no-dependencies --packagePath "restclient-${TAG}.vsix"
          fi
      - name: Open VSX (skipped if this version is already there)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VER="${TAG#v}"
          ID=$(node -p "const p=require('./package.json');p.publisher+'.'+p.name")
          if npx ovsx get "$ID" -v "$VER" --metadata >/dev/null 2>&1; then
            echo "Open VSX already has $VER"
          else
            npx ovsx publish "restclient-${TAG}.vsix" -p "$OVSX_PAT"
          fi
      # Two things about this step.
      #
      # NPM_TOKEN is deliberately absent from the guard above: the runner on npm
      # is a convenience, and a missing token there should not mark a release
      # that did reach both extension stores as failed. It warns instead.
      #
      # npm is upgraded because trusted publishing (OIDC) needs npm >= 11.5.1 and
      # Node 22 ships 10.x. With `id-token: write` granted and a trusted publisher
      # configured for the package on npmjs.com, `npm publish` authenticates with
      # the GitHub identity and NODE_AUTH_TOKEN is never used. That is the endgame:
      # npm is removing direct publishing with bypass-2FA tokens in January 2027.
      # Until the publisher is configured the token below is what actually runs.
      - name: npm (skipped if this version is already there)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER="${TAG#v}"
          npm install -g npm@latest
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::No NPM_TOKEN: @vscode-restclient/cli $VER is not going to npm. The rest of the release is unaffected."
            exit 0
          fi
          node scripts/preparar-npm.mjs
          if npm view "@vscode-restclient/cli@$VER" version >/dev/null 2>&1; then
            echo "npm already has $VER"
          else
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc"
            (cd npm && npm publish --access public --userconfig "$RUNNER_TEMP/npmrc")
            rm -f "$RUNNER_TEMP/npmrc"
          fi
